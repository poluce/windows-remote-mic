<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Quick Menu Demo - 右下角扇形快捷菜单</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: #1e2227;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  /* 模拟桌面 */
  .desktop {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 40%),
      linear-gradient(135deg, #232830 0%, #15191e 100%);
  }

  .demo-tip {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #aab3bf;
    font-size: 16px;
    text-align: center;
    line-height: 1.8;
    pointer-events: none;
  }

  .demo-tip strong {
    color: #e8edf3;
  }

  .open-btn {
    position: absolute;
    bottom: 90px;
    right: 90px;
    padding: 10px 18px;
    border: 1px solid #3a4350;
    border-radius: 999px;
    background: #2a313a;
    color: #e8edf3;
    font-size: 16px;
    cursor: pointer;
    z-index: 5;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: background .15s, transform .15s;
  }
  .open-btn:hover { background: #37404b; transform: translateY(-1px); }

  /* ===== 扇形快捷菜单 ===== */
  .quick-menu {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 420px;
    height: 420px;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.6) translate(40px, 40px);
    transform-origin: right bottom;
    transition: opacity .18s ease, transform .22s cubic-bezier(.2,.9,.3,1.2);
    z-index: 10;
  }

  .quick-menu.open {
    opacity: 1;
    transform: scale(1) translate(0, 0);
    pointer-events: auto;
  }

  .quick-menu svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .fan-bg {
    fill: rgba(248, 250, 252, 1);
    stroke: #d0d7de;
    stroke-width: 1.5;
  }

  .ring-divider {
    stroke: #d8dee6;
    stroke-width: 1.5;
    fill: none;
  }

  .outer-circle {
    fill: #ffffff;
    stroke: #c9d1d9;
    stroke-width: 1.5;
  }

  .outer-circle-text {
    fill: #57606a;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 600;
  }

  .inner-circle {
    fill: #ffffff;
    stroke: #c9d1d9;
    stroke-width: 1.5;
  }

  .inner-circle-text {
    fill: #57606a;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 600;
  }

  .ring-buttons {
    transition: opacity .15s;
  }

  .ring-buttons:not(.active) {
    opacity: .35;
  }

  .outer-circle.selected,
  .inner-circle.selected {
    stroke: #2f6fed;
    stroke-width: 3;
    fill: #edf3ff;
  }

  .outer-circle.selected + text,
  .inner-circle.selected + text {
    fill: #2f6fed;
  }

  .center-circle {
    fill: #ffffff;
    stroke: #d0d7de;
    stroke-width: 1.5;
  }

  .placeholder {
    fill: #57606a;
    font-size: 15px;
    text-anchor: middle;
    font-weight: 600;
  }

  .placeholder-sub {
    fill: #8c959f;
    font-size: 11px;
    text-anchor: middle;
  }

  .center-title {
    fill: #1f2328;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 700;
  }

  .center-desc {
    fill: #57606a;
    font-size: 11px;
    text-anchor: middle;
  }

  .close-hint {
    position: absolute;
    right: 18px;
    bottom: 14px;
    color: #8c959f;
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="desktop">
  <div class="demo-tip">
    模拟桌面右下角<br>
    点下方按钮 = 按遥控器 <strong>菜单键</strong><br>
    再点一次 / 点击扇形外空白 = 关闭
  </div>

  <button class="open-btn" id="openBtn">模拟按菜单键</button>

  <div class="quick-menu" id="quickMenu">
    <svg viewBox="0 0 420 420">
      <!-- 外环：主菜单（留空） -->
      <path class="fan-bg" d="M 420 420 L 20 420 A 400 400 0 0 1 420 20 Z" />
      <path class="ring-divider" d="M 120 420 A 300 300 0 0 1 420 120" />
      <path class="ring-divider" d="M 220 420 A 200 200 0 0 1 420 220" />

      <!-- 外环分界线（示意，先留空） -->

      <!-- 内环分界线（示意） -->

      <!-- 外环 6 个圆形按钮 -->
      <g id="outerRing" class="ring-buttons outer-ring active">
        <circle class="outer-circle" cx="73.0" cy="374.3" r="34" />
        <text class="outer-circle-text" x="73.0" y="379.0">1</text>

        <circle class="outer-circle" cx="96.6" cy="286.1" r="34" />
        <text class="outer-circle-text" x="96.6" y="290.0">2</text>

        <circle class="outer-circle" cx="142.3" cy="206.9" r="34" />
        <text class="outer-circle-text" x="142.3" y="211.0">3</text>

        <circle class="outer-circle" cx="206.9" cy="142.3" r="34" />
        <text class="outer-circle-text" x="206.9" y="146.0">4</text>

        <circle class="outer-circle" cx="286.1" cy="96.6" r="34" />
        <text class="outer-circle-text" x="286.1" y="100.0">5</text>

        <circle class="outer-circle" cx="374.3" cy="73.0" r="34" />
        <text class="outer-circle-text" x="374.3" y="77.0">6</text>
      </g>

      <!-- 内环 6 个圆形按钮 -->
      <g id="innerRing" class="ring-buttons inner-ring">
        <circle class="inner-circle" cx="172.1" cy="387.4" r="34" />
        <text class="inner-circle-text" x="172.1" y="392.0">1</text>

        <circle class="inner-circle" cx="189.0" cy="324.3" r="34" />
        <text class="inner-circle-text" x="189.0" y="329.0">2</text>

        <circle class="inner-circle" cx="221.7" cy="267.8" r="34" />
        <text class="inner-circle-text" x="221.7" y="272.0">3</text>

        <circle class="inner-circle" cx="267.8" cy="221.7" r="34" />
        <text class="inner-circle-text" x="267.8" y="226.0">4</text>

        <circle class="inner-circle" cx="324.3" cy="189.0" r="34" />
        <text class="inner-circle-text" x="324.3" y="193.0">5</text>

        <circle class="inner-circle" cx="387.4" cy="172.1" r="34" />
        <text class="inner-circle-text" x="387.4" y="176.0">6</text>
      </g>

      <!-- 最内部：介绍区 -->
      <path class="center-circle" d="M 420 420 L 220 420 A 200 200 0 0 1 420 220 Z" />
      <text class="center-title" x="320" y="325">介绍区</text>
      <text class="center-desc" x="320" y="347">当前选中项说明</text>
    </svg>

    <div class="close-hint">再按菜单键关闭</div>
  </div>
</div>

<script>
  const menu = document.getElementById('quickMenu');
  const btn = document.getElementById('openBtn');
  const outerGroup = document.getElementById('outerRing');
  const innerGroup = document.getElementById('innerRing');
  let ring = 'outer';
  let index = 0;

  function toggle(open) {
    menu.classList.toggle('open', open);
    btn.textContent = open ? '模拟再按菜单键关闭' : '模拟按菜单键';
    if (open) {
      document.body.focus();
      updateSelection();
    }
  }

  function updateSelection() {
    outerGroup.classList.toggle('active', ring === 'outer');
    innerGroup.classList.toggle('active', ring === 'inner');

    [outerGroup, innerGroup].forEach((group) => {
      const circles = Array.from(group.querySelectorAll('circle'));
      const isActiveGroup = group === (ring === 'outer' ? outerGroup : innerGroup);
      circles.forEach((circle, i) => {
        circle.classList.toggle('selected', isActiveGroup && i === index);
      });
    });
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggle(!menu.classList.contains('open'));
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && menu.classList.contains('open')) {
      toggle(false);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') toggle(false);
    if (!menu.classList.contains('open')) return;

    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      ring = ring === 'outer' ? 'inner' : 'outer';
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      index = (index + 1) % 6;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      index = (index + 5) % 6;
    } else {
      return;
    }
    updateSelection();
  });

  document.body.tabIndex = 0;
  updateSelection();
</script>
</body>
</html>
