name: Release Windows Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build NSIS installer and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Prepare virtual HID driver bundle
        shell: pwsh
        run: ./scripts/prepare-vhid-bundle.ps1

      - name: Verify driver bundle is complete
        shell: pwsh
        run: |
          $required = @(
            'WinUHid.dll',
            'WinUHidDriver.dll',
            'WinUHidDriver.inf',
            'devcon.exe',
            'install-winuhid.ps1',
            'uninstall-winuhid.ps1'
          )
          $dir = 'src-tauri/windows/driver'
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
            throw "Driver bundle incomplete, missing: $($missing -join ', ')"
          }
          if (-not (Get-ChildItem $dir -Filter *.cat)) {
            throw "Driver bundle has no catalog (.cat)"
          }
          if (-not (Get-ChildItem $dir -Filter '*.dll.xz')) {
            throw "Driver bundle has no Frida Gadget archive (*.dll.xz)"
          }
          Get-ChildItem $dir | Select-Object Name, Length

      - name: Prepare installer extras (VB-CABLE helper scripts)
        shell: pwsh
        run: ./scripts/prepare-installer-extras.ps1

      - name: Verify installer extras are complete
        shell: pwsh
        run: |
          $dir = 'src-tauri/windows/vb-cable'
          $required = @('install-vb-cable.ps1', 'vb-cable.sha256')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
            throw "Installer extras incomplete, missing: $($missing -join ', ')"
          }
          $hash = ((Get-Content (Join-Path $dir 'vb-cable.sha256') | Where-Object { $_ -notmatch '^\s*#' -and $_.Trim() -ne '' }) -join '').Trim()
          if ($hash -notmatch '^[0-9a-fA-F]{64}$') {
            throw "vb-cable.sha256 has no valid SHA-256 digest"
          }
          Get-ChildItem $dir | Select-Object Name, Length

      - name: Detect updater signing key
        id: updater
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY 未配置：本次构建不生成自动更新产物（.sig / latest.json），用户只能手动下载安装。"
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build installer (with updater signing)
        if: steps.updater.outputs.enabled == 'true'
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build installer (without updater signing)
        if: steps.updater.outputs.enabled != 'true'
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify updater signature
        if: steps.updater.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $sig = "$($setup.FullName).sig"
          if (-not (Test-Path $sig)) { throw "Updater signature missing: $sig" }
          if ([string]::IsNullOrWhiteSpace((Get-Content $sig -Raw))) { throw "Updater signature file is empty" }
          Write-Output ("updater artifact:  " + $setup.Name)
          Write-Output ("updater signature: " + (Split-Path $sig -Leaf))

      - name: Verify VB-CABLE helper scripts are embedded in installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $seven)) { $seven = "7z.exe" }
          $out = Join-Path $env:RUNNER_TEMP "rm-installer-extract"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          & $seven x $setup.FullName "-o$out" -y | Out-Null
          foreach ($name in @('install-vb-cable.ps1', 'vb-cable.sha256')) {
            $found = Get-ChildItem $out -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "VB-CABLE helper '$name' is missing from installer payload" }
            Write-Output ("embedded: " + $found.FullName)
          }

      - name: Collect release artifacts and generate SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe*" staging/
          Copy-Item "target/release/*.exe" staging/
          # 自动更新签名与安装器同目录（Tauri v2 对 NSIS 直接签名安装包本体，.exe.sig）
          $setup = Get-ChildItem staging/*.exe | Where-Object { $_.Name -like '*setup.exe' } | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup executable not found in staging" }
          # GitHub Release 会把资产名里的空格变成点（历史产物都是 Remote.Mic_...），
          # 提前统一成点号，保证 latest.json 里的下载 URL 与实际资产名一致。
          $normalized = ($setup.Name -replace '\s+', '.')
          if ($normalized -ne $setup.Name) {
            $oldName = $setup.Name
            $dir = Split-Path -Parent $setup.FullName
            Rename-Item -LiteralPath $setup.FullName -NewName $normalized
            $oldSig = Join-Path $dir "$oldName.sig"
            if (Test-Path -LiteralPath $oldSig) {
              Rename-Item -LiteralPath $oldSig -NewName "$normalized.sig"
            }
            $setup = Get-Item -LiteralPath (Join-Path $dir $normalized)
            Write-Output "normalized artifact name: $($setup.Name)"
          }
          Get-ChildItem staging/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content staging/SHA256SUMS.txt
          }
          Get-ChildItem staging | Select-Object Name, Length

      - name: Generate updater manifest (latest.json)
        if: steps.updater.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $setup = Get-ChildItem staging/*.exe | Where-Object { $_.Name -like '*setup.exe' } | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup executable not found in staging" }
          ./scripts/generate-updater-manifest.ps1 `
            -Version $config.version `
            -Tag "${{ inputs.tag || github.ref_name }}" `
            -InstallerPath $setup.FullName `
            -SignaturePath "$($setup.FullName).sig" `
            -OutputPath staging/latest.json `
            -Repository "${{ github.repository }}"
          Get-Content staging/latest.json -Raw

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-mic-windows-installer
          path: staging/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Remote Mic ${{ inputs.tag || github.ref_name }}
          body: |
            ## 发布说明

            - 安装包：NSIS 安装器（**全机安装，需要管理员权限**，一次 UAC 完成应用与虚拟 HID 驱动安装）
            - 虚拟 HID 键盘驱动与 Frida Gadget 均已内置在安装包中，安装后无需任何运行时下载，也无需手动运行脚本；驱动当前为测试签名，安装器会自动把随包证书装入本机信任库
            - 首次连接遥控器时可能再弹一次 UAC（HOGP 旁路需要管理员权限注入），请点「是」
            - 校验：SHA256 见 `SHA256SUMS.txt`
            - 自动更新：安装本版本后，可在「通用设置 → 关于与更新」中检查并安装后续版本；带更新功能之前的旧版本需先手动安装一次本版本
            - 构建：GitHub Actions 自动构建
          files: |
            staging/*.exe
            staging/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updater artifacts to release
        if: steps.updater.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $sig = Get-ChildItem staging/*.sig | Select-Object -First 1
          if (-not $sig) { throw "Updater signature not found in staging" }
          gh release upload $tag staging/latest.json $sig.FullName --clobber
          Write-Output "uploaded latest.json and $($sig.Name)"
