name: Release Windows Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build NSIS installer and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Prepare virtual HID driver bundle
        shell: pwsh
        run: ./scripts/prepare-vhid-bundle.ps1

      - name: Verify driver bundle is complete
        shell: pwsh
        run: |
          $required = @(
            'WinUHid.dll',
            'WinUHidDriver.dll',
            'WinUHidDriver.inf',
            'devcon.exe',
            'install-winuhid.ps1',
            'uninstall-winuhid.ps1'
          )
          $dir = 'src-tauri/windows/driver'
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
            throw "Driver bundle incomplete, missing: $($missing -join ', ')"
          }
          if (-not (Get-ChildItem $dir -Filter *.cat)) {
            throw "Driver bundle has no catalog (.cat)"
          }
          Get-ChildItem $dir | Select-Object Name, Length

      - name: Build installer
        run: npm run tauri build

      - name: Collect release artifacts and generate SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" staging/
          Copy-Item "target/release/*.exe" staging/
          Get-ChildItem staging/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content staging/SHA256SUMS.txt
          }
          Get-ChildItem staging | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-mic-windows-installer
          path: staging/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Remote Mic ${{ inputs.tag || github.ref_name }}
          body: |
            ## 发布说明

            - 安装包：NSIS 安装器（**全机安装，需要管理员权限**，一次 UAC 完成应用与虚拟 HID 驱动安装）
            - 虚拟 HID 键盘驱动已内置在安装包中，无需再手动运行任何脚本；驱动当前为测试签名，安装器会自动把随包证书装入本机信任库
            - 校验：SHA256 见 `SHA256SUMS.txt`
            - 构建：GitHub Actions 自动构建
          files: |
            staging/*.exe
            staging/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
