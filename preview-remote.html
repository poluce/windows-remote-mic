<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Mic — RC003 遥控器仿真</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f5f7;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1f2328;
  }

  .page {
    text-align: center;
  }
  .page h1 { font-size: 20px; }
  .page .hint { color: #57606a; font-size: 13px; margin-bottom: 18px; }

  .remote {
    position: relative;
    width: 250px;
    margin: 0 auto;
    padding: 22px 16px 28px;
    background: linear-gradient(145deg, #2b2f36, #1c1f24);
    border-radius: 34px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      0 12px 28px rgba(0,0,0,.45),
      0 2px 6px rgba(0,0,0,.3);
  }

  .remote::after {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    width: 42px;
    height: 4px;
    background: rgba(255,255,255,.18);
    border-radius: 4px;
    transform: translateX(-50%);
  }

  input[type="radio"] { display: none; }

  .key {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e6e8eb;
    background: linear-gradient(145deg, #3a3f47, #262a30);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    box-shadow: 0 3px 0 rgba(0,0,0,.35);
    cursor: pointer;
    user-select: none;
    transition: transform .08s, background .15s, box-shadow .15s;
  }
  .key:hover { background: #464b54; }

  input[type="radio"]:checked + .key {
    background: #2f6fed;
    border-color: #2f6fed;
    color: #fff;
    box-shadow: 0 0 0 2px rgba(47,111,237,.45);
  }

  .top-row { display: flex; justify-content: space-between; margin-bottom: 14px; }
  .top-row .key { width: 92px; height: 34px; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 34px);
    gap: 6px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .ok { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .bottom-grid {
    display: grid;
    grid-template-columns: repeat(2, 96px);
    gap: 8px;
    justify-content: center;
  }
  .bottom-grid .key { height: 40px; }

  .status-note {
    margin-top: 20px;
    color: #57606a;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>小米蓝牙遥控器 2 Pro（RC003）仿真</h1>
    <div class="hint">点击任意按键，按钮会高亮（纯 CSS radio）</div>

    <div class="remote">
      <div class="top-row">
        <input type="radio" name="btn" id="power">
        <label class="key" for="power">电源</label>
        <input type="radio" name="btn" id="mic">
        <label class="key" for="mic">麦克风</label>
      </div>

      <div class="dpad">
        <input type="radio" name="btn" id="up">
        <label class="key up" for="up">上</label>
        <input type="radio" name="btn" id="left">
        <label class="key left" for="left">左</label>
        <input type="radio" name="btn" id="ok">
        <label class="key ok" for="ok">确定</label>
        <input type="radio" name="btn" id="right">
        <label class="key right" for="right">右</label>
        <input type="radio" name="btn" id="down">
        <label class="key down" for="down">下</label>
      </div>

      <div class="bottom-grid">
        <input type="radio" name="btn" id="back">
        <label class="key" for="back">返回</label>
        <input type="radio" name="btn" id="volup">
        <label class="key" for="volup">音量+</label>
        <input type="radio" name="btn" id="home">
        <label class="key" for="home">主页</label>
        <input type="radio" name="btn" id="voldown">
        <label class="key" for="voldown">音量−</label>
        <input type="radio" name="btn" id="menu">
        <label class="key" for="menu">菜单</label>
        <input type="radio" name="btn" id="tv">
        <label class="key" for="tv">TV</label>
      </div>
    </div>

    <p class="status-note">当前是纯 CSS 预览版；下一步可以把这个形态搬进应用内的按键映射页。</p>
  </div>
</body>
</html>
