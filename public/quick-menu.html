<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Quick Menu</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  .quick-menu {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  .quick-menu svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .fan-bg {
    fill: rgba(248, 250, 252, 0);
    stroke: #d0d7de;
    stroke-width: 1.5;
  }

  .ring-divider {
    stroke: #d8dee6;
    stroke-width: 1.5;
    fill: none;
  }

  .segment-line {
    stroke: #e2e6ec;
    stroke-width: 1;
    stroke-dasharray: 3 4;
  }

  .outer-circle {
    fill: #ffffff;
    stroke: #c9d1d9;
    stroke-width: 1.5;
  }

  .outer-circle-text {
    fill: #57606a;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 600;
  }

  .center-circle {
    fill: rgba(255, 255, 255, 0);
    stroke: #d0d7de;
    stroke-width: 1.5;
  }

  .placeholder {
    fill: #57606a;
    font-size: 15px;
    text-anchor: middle;
    font-weight: 600;
  }

  .placeholder-sub {
    fill: #8c959f;
    font-size: 11px;
    text-anchor: middle;
  }

  .center-title {
    fill: #1f2328;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 700;
  }

  .center-desc {
    fill: #57606a;
    font-size: 11px;
    text-anchor: middle;
  }

  .close-hint {
    position: absolute;
    right: 18px;
    bottom: 14px;
    color: #8c959f;
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="quick-menu">
    <svg viewBox="0 0 420 420">
      <path class="fan-bg" d="M 420 420 L 20 420 A 400 400 0 0 1 420 20 Z" />
      <path class="ring-divider" d="M 120 420 A 300 300 0 0 1 420 120" />
      <path class="ring-divider" d="M 220 420 A 200 200 0 0 1 420 220" />

      <path class="segment-line" d="M 420 420 L 110 110" />
      <path class="segment-line" d="M 420 420 L 40 250" />
      <path class="segment-line" d="M 420 420 L 190 420" />

      <path class="segment-line" d="M 420 420 L 200 200" />
      <path class="segment-line" d="M 420 420 L 120 300" />

      <g class="outer-ring-buttons">
        <circle class="outer-circle" cx="73.0" cy="374.3" r="34" />
        <text class="outer-circle-text" x="73.0" y="379.0">1</text>

        <circle class="outer-circle" cx="96.6" cy="286.1" r="34" />
        <text class="outer-circle-text" x="96.6" y="290.0">2</text>

        <circle class="outer-circle" cx="142.3" cy="206.9" r="34" />
        <text class="outer-circle-text" x="142.3" y="211.0">3</text>

        <circle class="outer-circle" cx="206.9" cy="142.3" r="34" />
        <text class="outer-circle-text" x="206.9" y="146.0">4</text>

        <circle class="outer-circle" cx="286.1" cy="96.6" r="34" />
        <text class="outer-circle-text" x="286.1" y="100.0">5</text>

        <circle class="outer-circle" cx="374.3" cy="73.0" r="34" />
        <text class="outer-circle-text" x="374.3" y="77.0">6</text>
      </g>

      <text class="placeholder" x="240" y="235">内环 · 工具</text>
      <text class="placeholder-sub" x="240" y="255">（留空）</text>

      <path class="center-circle" d="M 420 420 L 220 420 A 200 200 0 0 1 420 220 Z" />
      <text class="center-title" x="320" y="325">介绍区</text>
      <text class="center-desc" x="320" y="347">当前选中项说明</text>
    </svg>
    <div class="close-hint">再按菜单键关闭</div>
  </div>
</body>
</html>
