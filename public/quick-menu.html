<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Quick Menu</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  .quick-menu {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  .quick-menu svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .fan-bg {
    fill: rgba(248, 250, 252, 1);
    stroke: #d0d7de;
    stroke-width: 1.5;
  }

  .ring-divider {
    stroke: #d8dee6;
    stroke-width: 1.5;
    fill: none;
  }

  .outer-circle {
    fill: #ffffff;
    stroke: #c9d1d9;
    stroke-width: 1.5;
  }

  .outer-circle-text {
    fill: #57606a;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 600;
  }

  .inner-circle {
    fill: #ffffff;
    stroke: #c9d1d9;
    stroke-width: 1.5;
  }

  .inner-circle-text {
    fill: #57606a;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 600;
  }

  .ring-buttons {
    transition: opacity .15s;
  }

  .ring-buttons:not(.active) {
    opacity: .35;
  }

  .outer-circle.selected,
  .inner-circle.selected {
    stroke: #2f6fed;
    stroke-width: 3;
    fill: #edf3ff;
  }

  .outer-circle-text.selected-text,
  .inner-circle-text.selected-text {
    fill: #2f6fed;
  }

  .ring-texts {
    transform-origin: 420px 420px;
    transition: transform 0.18s ease;
  }

  .ring-texts.no-anim {
    transition: none;
  }

  .center-circle {
    fill: #ffffff;
    stroke: #d0d7de;
    stroke-width: 1.5;
  }

  .placeholder {
    fill: #57606a;
    font-size: 15px;
    text-anchor: middle;
    font-weight: 600;
  }

  .placeholder-sub {
    fill: #8c959f;
    font-size: 11px;
    text-anchor: middle;
  }

  .center-title {
    fill: #1f2328;
    font-size: 16px;
    text-anchor: middle;
    font-weight: 700;
  }

  .center-desc {
    fill: #57606a;
    font-size: 11px;
    text-anchor: middle;
  }

  .close-hint {
    position: absolute;
    right: 18px;
    bottom: 14px;
    color: #8c959f;
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="quick-menu">
    <svg viewBox="0 0 420 420">
      <path class="fan-bg" d="M 420 420 L 20 420 A 400 400 0 0 1 420 20 Z" />
      <path class="ring-divider" d="M 120 420 A 300 300 0 0 1 420 120" />
      <path class="ring-divider" d="M 220 420 A 200 200 0 0 1 420 220" />



      <g id="outerRing" class="ring-buttons outer-ring active">
        <g class="ring-circles">
          <circle class="outer-circle" cx="81.9" cy="329.4" r="34" />
          <circle class="outer-circle" cx="116.9" cy="245.0" r="34" />
          <circle class="outer-circle" cx="142.3" cy="206.9" r="34" />
          <circle class="outer-circle" cx="172.5" cy="172.5" r="34" />
          <circle class="outer-circle" cx="245.0" cy="116.9" r="34" />
          <circle class="outer-circle" cx="329.4" cy="81.9" r="34" />
        </g>
        <g class="ring-texts">
          <text class="outer-circle-text" x="81.9" y="334.0">1</text>
          <text class="outer-circle-text" x="116.9" y="250.0">2</text>
          <text class="outer-circle-text" x="142.3" y="211.0">3</text>
          <text class="outer-circle-text" x="172.5" y="177.0">4</text>
          <text class="outer-circle-text" x="245.0" y="121.0">5</text>
          <text class="outer-circle-text" x="329.4" y="86.0">6</text>
        </g>
      </g>

      <g id="innerRing" class="ring-buttons inner-ring">
        <g class="ring-circles">
          <circle class="inner-circle" cx="178.5" cy="355.3" r="34" />
          <circle class="inner-circle" cx="203.5" cy="295.0" r="34" />
          <circle class="inner-circle" cx="221.7" cy="267.8" r="34" />
          <circle class="inner-circle" cx="243.2" cy="243.2" r="34" />
          <circle class="inner-circle" cx="295.0" cy="203.5" r="34" />
          <circle class="inner-circle" cx="355.3" cy="178.5" r="34" />
        </g>
        <g class="ring-texts">
          <text class="inner-circle-text" x="178.5" y="360.0">1</text>
          <text class="inner-circle-text" x="203.5" y="300.0">2</text>
          <text class="inner-circle-text" x="221.7" y="272.0">3</text>
          <text class="inner-circle-text" x="243.2" y="248.0">4</text>
          <text class="inner-circle-text" x="295.0" y="208.0">5</text>
          <text class="inner-circle-text" x="355.3" y="183.0">6</text>
        </g>
      </g>

      <path class="center-circle" d="M 420 420 L 220 420 A 200 200 0 0 1 420 220 Z" />
      <text class="center-title" x="320" y="325">介绍区</text>
      <text class="center-desc" x="320" y="347">当前选中项说明</text>
    </svg>
    <div class="close-hint">再按菜单键关闭</div>
  </div>

  <script>
    const outerGroup = document.getElementById('outerRing');
    const innerGroup = document.getElementById('innerRing');
    const centerDesc = document.querySelector('.center-desc');

    // 固定 6 个槽位，FRAME_INDEX = 45° 线上的那个位置
    const MENU_ITEMS = ['1', '2', '3', '4', '5', '6'];
    const FRAME_INDEX = 3;

    let ring = 'outer';
    let outerOffset = 0;
    let innerOffset = 0;
    let rolling = false;
    const STEP_ANGLE = 15;

    function activeOffset() {
      return ring === 'outer' ? outerOffset : innerOffset;
    }

    function setActiveOffset(value) {
      if (ring === 'outer') outerOffset = value;
      else innerOffset = value;
    }

    function activeTextsGroup() {
      return ring === 'outer'
        ? outerGroup.querySelector('.ring-texts')
        : innerGroup.querySelector('.ring-texts');
    }

    function render() {
      outerGroup.classList.toggle('active', ring === 'outer');
      innerGroup.classList.toggle('active', ring === 'inner');

      [
        { group: outerGroup, offset: outerOffset, isOuter: true },
        { group: innerGroup, offset: innerOffset, isOuter: false },
      ].forEach(({ group, offset, isOuter }) => {
        const texts = Array.from(group.querySelectorAll('text'));
        const circles = Array.from(group.querySelectorAll('circle'));
        const isActive = isOuter ? ring === 'outer' : ring === 'inner';

        texts.forEach((text, i) => {
          text.textContent = MENU_ITEMS[(i + offset) % 6];
          text.classList.toggle('selected-text', isActive && i === FRAME_INDEX);
        });
        circles.forEach((circle, i) => {
          circle.classList.toggle('selected', isActive && i === FRAME_INDEX);
        });
      });

      const currentItem = MENU_ITEMS[(FRAME_INDEX + activeOffset()) % 6];
      centerDesc.textContent = `${ring === 'outer' ? '外环' : '内环'} · ${currentItem}`;
    }

    function scrollActiveRing(dir) {
      if (rolling) return;
      const textsGroup = activeTextsGroup();
      rolling = true;
      textsGroup.classList.remove('no-anim');
      textsGroup.style.transform = `rotate(${dir * STEP_ANGLE}deg)`;

      setTimeout(() => {
        setActiveOffset((activeOffset() + (dir > 0 ? 1 : 5)) % 6);
        render();
        textsGroup.classList.add('no-anim');
        textsGroup.style.transform = 'rotate(0deg)';
        rolling = false;
      }, 180);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        ring = ring === 'outer' ? 'inner' : 'outer';
        render();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        scrollActiveRing(1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        scrollActiveRing(-1);
      }
    });

    document.body.tabIndex = 0;
    document.body.focus();
    render();
  </script>
</body>
</html>
