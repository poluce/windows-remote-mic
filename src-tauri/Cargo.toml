[package]
name = "remote-mic"
version.workspace = true
description = "Windows Remote Mic — turn Xiaomi Bluetooth voice remote into a wireless microphone"
authors = ["poluce"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remote_mic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 固定 2.12.x：2.13+/2.14 要求 tauri >= 2.12，而本仓库仍锁在 tauri 2.11.5；
# 同时要与 package.json 的 @tauri-apps/plugin-updater 版本保持一致。
tauri-plugin-updater = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
core-ble = { path = "../crates/core-ble" }
core-atvv = { path = "../crates/core-atvv" }
core-audio = { path = "../crates/core-audio" }
core-hid = { path = "../crates/core-hid" }
core-input = { path = "../crates/core-input" }
core-dispatch = { path = "../crates/core-dispatch" }
core-app-profile = { path = "../crates/core-app-profile" }
core-mapping = { path = "../crates/core-mapping" }
core-config = { path = "../crates/core-config" }
core-voice = { path = "../crates/core-voice" }
core-stats = { path = "../crates/core-stats" }
core-log = { path = "../crates/core-log" }

