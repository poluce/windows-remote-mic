<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 (浅色主题) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 麦克风胶囊渐变 (浅色主题) -->
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 蓝牙发光特效 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 投影 (更柔和的阴影，适配浅色背景) -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 图标底座 (圆角矩形) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 背景内圆装饰线 -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g filter="url(#softShadow)">
    <!-- 左侧无线声波 -->
    <path d="M 120 200 A 70 70 0 0 0 120 280" fill="none" stroke="#0EA5E9" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <path d="M 90 170 A 110 110 0 0 0 90 310" fill="none" stroke="#0EA5E9" stroke-width="10" stroke-linecap="round" opacity="0.2"/>

    <!-- 右侧无线声波 -->
    <path d="M 392 200 A 70 70 0 0 1 392 280" fill="none" stroke="#0EA5E9" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <path d="M 422 170 A 110 110 0 0 1 422 310" fill="none" stroke="#0EA5E9" stroke-width="10" stroke-linecap="round" opacity="0.2"/>

    <!-- 麦克风核心胶囊 -->
    <rect x="196" y="120" width="120" height="200" rx="60" fill="url(#capsuleGrad)" stroke="#94A3B8" stroke-width="6"/>

    <!-- 麦克风 U 型托架 -->
    <path d="M 170 230 A 86 86 0 0 0 342 230" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>

    <!-- 麦克风立杆 -->
    <line x1="256" y1="316" x2="256" y2="384" stroke="#334155" stroke-width="14" stroke-linecap="round"/>

    <!-- 麦克风底座 -->
    <line x1="200" y1="384" x2="312" y2="384" stroke="#334155" stroke-width="14" stroke-linecap="round"/>

    <!-- 蓝牙符号发光层 -->
    <g filter="url(#glow)">
      <polyline points="228,180 284,236 256,264 256,176 284,204 228,260" 
                fill="none" 
                stroke="#38BDF8" 
                stroke-width="11" 
                stroke-linecap="round" 
                stroke-linejoin="round" 
                opacity="0.8"/>
    </g>

    <!-- 蓝牙符号主体 -->
    <polyline points="228,180 284,236 256,264 256,176 284,204 228,260" 
              fill="none" 
              stroke="#0F172A" 
              stroke-width="8" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
  </g>

  <!-- 顶部状态指示灯 -->
  <circle cx="256" cy="148" r="5" fill="#0284C7" filter="url(#glow)"/>
</svg>